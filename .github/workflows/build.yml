name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"
  # Compile what is about to be merged. Until now the only build was on a tag,
  # so a patch that does not compile was discovered after it had already landed
  # on main and been tagged.
  pull_request:
    branches:
      - main

# A second push to a pull request makes the first build pointless; let it go
# rather than holding four runners on stale code. Tag builds are
# never cancelled -- they produce the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A tag usually points at the merge of a pull request whose last push this
  # workflow already compiled: same tree, different commit. Building it again
  # took two hours per architecture, so a tag takes that run's zips instead and
  # builds only when no successful pull request run holds its exact tree.
  prebuilt:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
      names: ${{ steps.find.outputs.names }}
    steps:
      - name: Find a pull request build of this tree
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tree=$(gh api "repos/$REPO/commits/$GITHUB_REF" --jq .commit.tree.sha)
          echo "tag $GITHUB_REF_NAME: tree $tree"
          runs=$(gh run list -R "$REPO" -w build.yml -e pull_request -s success -L 30 \
            --json databaseId,headSha -q '.[] | "\(.databaseId) \(.headSha)"')
          while read -r run sha; do
            [ -n "$run" ] || continue
            run_tree=$(gh api "repos/$REPO/commits/$sha" --jq .commit.tree.sha)
            [ "$run_tree" = "$tree" ] || continue
            artifacts=$(gh api "repos/$REPO/actions/runs/$run/artifacts" \
              --jq '[.artifacts[] | select(.name | startswith("CamoufoxBuilds-"))]')
            if [ "$(jq 'length' <<<"$artifacts")" = 0 ] || [ "$(jq 'any(.expired)' <<<"$artifacts")" = true ]; then
              echo "run $run built this tree, but its zips are gone"
              continue
            fi
            echo "run $run built this tree at $sha; reusing its zips"
            echo "run_id=$run" >> "$GITHUB_OUTPUT"
            echo "names=$(jq -c 'map(.name)' <<<"$artifacts")" >> "$GITHUB_OUTPUT"
            break
          done <<<"$runs"
          grep -q '^run_id=' "$GITHUB_OUTPUT" || echo "No pull request build holds this tree; building it."

  reuse:
    needs: prebuilt
    if: needs.prebuilt.outputs.run_id != ''
    runs-on: ubuntu-latest
    permissions:
      actions: read
    strategy:
      matrix:
        name: ${{ fromJSON(needs.prebuilt.outputs.names) }}
    steps:
      # Uploaded again under the same name, so the tag run carries its
      # binaries as a built one does and anything reading them finds them.
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ needs.prebuilt.outputs.run_id }}
          github-token: ${{ github.token }}
          name: ${{ matrix.name }}
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  build:
    needs: prebuilt
    # On a pull request `prebuilt` is skipped, which is not a failure.
    if: ${{ !cancelled() && !failure() && needs.prebuilt.outputs.run_id == '' }}
    runs-on: ubuntu-24.04
    env:
      # The mozconfig prefers the sccache that `mach bootstrap` installs, so
      # this is the cache the build fills. Bounded so four targets' caches
      # fit in the repository's cache quota.
      SCCACHE_DIR: /home/runner/.cache/sccache
      SCCACHE_CACHE_SIZE: 8G
    strategy:
      matrix:
        # Windows is not shipped. Dropping it also keeps a Windows-only
        # failure from skipping the release job, which needs every matrix
        # job to succeed. i686 went with it -- it was a Windows-only arch,
        # unsupported on both linux and macos.
        #
        # Pull requests build all four, so a tag of the same tree publishes
        # every architecture from the pull request's run (the prebuilt and
        # reuse jobs) instead of building again. arm64 is listed first: jobs
        # are queued in matrix order, so when runners are scarce the arm64
        # builds start first.
        arch: [arm64, x86_64]
        target: [macos, linux]

    steps:
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-dotnet: "true"
          remove-android: "true"
          remove-haskell: "true"
          remove-codeql: "true"
          remove-docker-images: "true"
          remove-cached-tools: "true"
          remove-swapfile: "true"
          verbose: "false"

      - name: Remove unwanted tools
        # Originally from here: https://github.com/AdityaGarg8/remove-unwanted-software/blob/master/action.yml
        run: |
          sudo apt-get remove -y '^aspnetcore-.*' > /dev/null
          sudo apt-get remove -y '^dotnet-.*' > /dev/null
          sudo apt-get remove -y '^llvm-.*' > /dev/null
          sudo apt-get remove -y 'php.*' > /dev/null
          sudo apt-get remove -y '^mongodb-.*' > /dev/null
          sudo apt-get remove -y '^mysql-.*' > /dev/null
          sudo apt-get remove -y azure-cli google-chrome-stable firefox ${POWERSHELL} mono-devel libgl1-mesa-dri --fix-missing > /dev/null
          if [[ (${CODENAME} = focal) || (${CODENAME} = jammy) ]]; then
            sudo apt-get remove -y google-cloud-sdk --fix-missing > /dev/null
            sudo apt-get remove -y google-cloud-cli --fix-missing > /dev/null
          fi
          sudo apt-get autoremove -y > /dev/null
          sudo apt-get clean > /dev/null

      - uses: actions/checkout@v2
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: "3.12"

      - name: Set up LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y lld-18 clang-18
          if [ "${{ matrix.arch }}" != "x86_64" ]; then
            sudo apt-get install -y libc6-i386 lib32gcc-s1 lib32stdc++6 gcc-multilib g++-multilib
          fi
          sudo update-alternatives --install /usr/bin/ld.lld ld.lld /usr/bin/ld.lld-18 100

      - name: Check disk space
        run: df -h

      - name: Install dependencies
        run: |
          # The runner image carries an apt.llvm.org source whose Release file
          # is gone, and one dead source fails the whole `apt-get update` with
          # exit 100 -- taking every build down with it. Nothing here comes
          # from that repository, so drop it before updating.
          sudo rm -f /etc/apt/sources.list.d/*llvm* /etc/apt/sources.list.d/*llvm*.sources || true
          sudo apt-get update
          sudo apt-get install -y msitools p7zip-full aria2 libsqlite3-dev

      - name: Read the browser version
        id: upstream
        run: grep '^version=' browser/upstream.sh >> "$GITHUB_OUTPUT"

      - name: Restore sccache
        uses: actions/cache@v4
        with:
          path: ${{ env.SCCACHE_DIR }}
          # The same prefix tests.yml uses for linux x86_64, so either workflow
          # can start from the other's cache. A pull request reads caches saved
          # on its own branch and on main.
          key: sccache-${{ matrix.target }}-${{ matrix.arch }}-${{ steps.upstream.outputs.version }}-${{ hashFiles('browser/patches/**', 'browser/additions/**', 'browser/assets/*.mozconfig') }}
          restore-keys: |
            sccache-${{ matrix.target }}-${{ matrix.arch }}-${{ steps.upstream.outputs.version }}-
            sccache-${{ matrix.target }}-${{ matrix.arch }}-

      - name: Fetch source
        working-directory: browser
        run: |
          make fetch

      - name: Setup and bootstrap
        working-directory: browser
        run: |
          make setup-minimal
          make mozbootstrap
          mkdir -p dist

      - name: Create swap space
        run: |
          sudo fallocate -l 24G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h /

      - name: Build
        env:
          # Cap Rust parallelism to lower peak memory (avoids OOM/SIGTERM).
          # Tune to taste: higher = faster but more RAM.
          CARGO_BUILD_JOBS: "1"
        working-directory: browser
        run: python3 ./multibuild.py --target ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CamoufoxBuilds-${{ matrix.target }}-${{ matrix.arch }}
          path: browser/dist/*

  release:
    needs: [build, reuse]
    # Skip the job outright on a pull request rather than letting it start and
    # create nothing: the create step below is already gated on a tag ref.
    # One of build and reuse is skipped on every tag.
    if: ${{ startsWith(github.ref, 'refs/tags/') && !cancelled() && !failure() }}
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
