# Mappings of Browserforge fingerprints to Camoufox config properties.

navigator:
  # Note: Browserforge tends to have outdated UAs.
  # The version will be replaced in Camoufox.
  userAgent: navigator.userAgent
  # userAgentData not in Firefox
  # doNotTrack is left to Firefox's default ("unspecified", no DNT header):
  # BrowserForge draws "1" for nearly every profile, which no current Firefox
  # ships with. Set navigator.doNotTrack by hand to change it; the DNT header
  # follows (privacy-signals-spoofing.patch).
  appCodeName: navigator.appCodeName
  appName: navigator.appName
  appVersion: navigator.appVersion
  oscpu: navigator.oscpu
  # webdriver is always True
  # Locale is now implemented separately:
  #   language: navigator.language
  #   languages: navigator.languages
  platform: navigator.platform
  # deviceMemory not in Firefox
  hardwareConcurrency: navigator.hardwareConcurrency
  product: navigator.product
  # Never override productSub #105
  # productSub: navigator.productSub
  # vendor is not necessary
  # vendorSub is not necessary
  maxTouchPoints: navigator.maxTouchPoints
  extraProperties:
    # Note: Changing pdfViewerEnabled is not recommended. This will be kept to True.
    # globalPrivacyControl is left to Firefox's default (false outside private
    # browsing). Mapping BrowserForge's draw set it only in workers, so a worker
    # said true while the window said false and no Sec-GPC header went out.
    # Set navigator.globalPrivacyControl by hand to change all three.

screen:
  # hasHDR is not implemented in Camoufox
  availLeft: screen.availLeft
  availTop: screen.availTop
  availWidth: screen.availWidth
  availHeight: screen.availHeight
  height: screen.height
  width: screen.width
  colorDepth: screen.colorDepth
  pixelDepth: screen.pixelDepth
  # devicePixelRatio is not recommended. Any value other than 1.0 is suspicious.
  pageXOffset: screen.pageXOffset
  pageYOffset: screen.pageYOffset
  outerHeight: window.outerHeight
  outerWidth: window.outerWidth
  innerHeight: window.innerHeight
  innerWidth: window.innerWidth
  screenX: window.screenX
  screenY: window.screenY
  # Tends to generate out of bounds (network inconsistencies):
  #   clientWidth: document.body.clientWidth
  #   clientHeight: document.body.clientHeight

# videoCard:
#  renderer: webgl:renderer
#  vendor: webgl:vendor

headers:
  # headers.User-Agent is redundant with navigator.userAgent
  # headers.Accept-Language is redundant with locale:*
  # Accept-Encoding is left to Firefox. It keeps three lists -- plain http
  # ("gzip, deflate"), https ("gzip, deflate, br, zstd") and dictionary
  # requests (adds "dcb, dcz") -- and BrowserForge's single value, written
  # over all three, made http:// requests claim br/zstd, which no Firefox
  # sends there.

battery:
  charging: battery:charging
  chargingTime: battery:chargingTime
  dischargingTime: battery:dischargingTime

# Unsupported: videoCodecs, audioCodecs, pluginsData, multimediaDevices
# Fonts are listed through the launcher.
